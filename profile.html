<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DIVYAM.AI — Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#f4f7ff;background:radial-gradient(circle at 10% 0%,rgba(59,130,246,.18),transparent 32%),radial-gradient(circle at 90% 100%,rgba(124,58,237,.16),transparent 35%),#07111f;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:520px;max-width:100%;padding:34px;border-radius:28px;background:rgba(10,25,43,.78);backdrop-filter:blur(24px);border:1px solid rgba(147,197,253,.14);box-shadow:0 30px 90px rgba(0,0,0,.4)}.avatar{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;background:linear-gradient(135deg,#2563eb,#7c3aed);border:3px solid rgba(255,255,255,.16);box-shadow:0 0 35px rgba(99,102,241,.3)}h1{text-align:center;font-size:28px;margin-bottom:6px}.sub{text-align:center;color:#8195ad;font-size:14px;margin-bottom:28px}.row{padding:16px 18px;margin-top:12px;border-radius:16px;background:rgba(4,14,28,.5);border:1px solid rgba(147,197,253,.09)}.label{font-size:11px;color:#71859e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.value{font-size:15px;color:#e8eef8;word-break:break-word}.buttons{display:flex;gap:12px;margin-top:24px}.buttons button{flex:1;padding:13px;border-radius:12px;border:1px solid rgba(147,197,253,.13);background:rgba(30,58,95,.4);color:#dbeafe;font-weight:bold;cursor:pointer}.buttons button:hover{background:rgba(59,130,246,.2)}.danger:hover{background:rgba(239,68,68,.15)!important;color:#fecaca}.status{text-align:center;color:#8195ad;font-size:12px;margin-top:16px}@media(max-width:560px){.card{padding:25px}.buttons{flex-direction:column}}
</style></head><body>
<div class="card"><div class="avatar" id="avatar">?</div><h1 id="name">Loading...</h1><div class="sub">Your DIVYAM.AI account 👤✨</div><div class="row"><div class="label">Registered email 📧</div><div class="value" id="email">Loading...</div></div><div class="row"><div class="label">Username / name 👤</div><div class="value" id="username">Loading...</div></div><div class="row"><div class="label">User ID 🆔</div><div class="value" id="userid">Loading...</div></div><div class="row"><div class="label">Account created 📅</div><div class="value" id="created">Loading...</div></div><div class="buttons"><button onclick="location.href='dashboard.html'">← Back to Dashboard</button><button class="danger" onclick="logout()">Log Out 🚪</button></div><div class="status" id="status"></div></div>
<script>
const SUPABASE_URL="https://teosakxikuswuhtbkmuv.supabase.co";const SUPABASE_KEY="sb_publishable_Wh3yh8OShJ2HnvwUhbInlg_0rGRIxOe";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadProfile(){const{data,error}=await supabaseClient.auth.getUser();if(error||!data.user){location.href='auth.html';return}const u=data.user;const name=u.user_metadata?.full_name||u.email?.split('@')[0]||'Student';document.getElementById('name').textContent=name;document.getElementById('username').textContent=name;document.getElementById('email').textContent=u.email||'Not available';document.getElementById('userid').textContent=u.id||'Not available';document.getElementById('created').textContent=u.created_at?new Date(u.created_at).toLocaleString(): 'Not available';document.getElementById('avatar').textContent=name.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'U'}
async function logout(){await supabaseClient.auth.signOut();location.href='auth.html'}loadProfile();
</script></body></html>
