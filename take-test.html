<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DIVYAM.AI — Take Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#080516;--panel:rgba(14,7,35,.9);--border:rgba(168,85,247,.32);--bright:rgba(217,70,239,.6);--a:#7c3aed;--b:#a855f7;--c:#ec4899;--text:#f8faff;--muted:#a8b7d0;--good:#34d399;--bad:#fb7185}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,rgba(124,58,237,.35),transparent 34%),radial-gradient(circle at 90% 100%,rgba(236,72,153,.22),transparent 38%),var(--bg);padding:24px 18px}.container{width:min(980px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.logo{font-size:24px;font-weight:800}.logo span{background:linear-gradient(90deg,#60a5fa,var(--b),var(--c));-webkit-background-clip:text;color:transparent}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--border);background:rgba(255,255,255,.05);color:white;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.btn:hover{background:rgba(168,85,247,.18)}.hero{margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9c86c9;font-weight:800;margin-bottom:8px}.hero h1{font-size:clamp(28px,5vw,44px);margin-bottom:7px}.hero p{color:var(--muted);line-height:1.6}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.pill{padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);font-size:12px;color:#d8d1e6}.progress-wrap{margin:18px 0}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.progress{height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));transition:width .25s}.timer{font-weight:800;color:#f5d0fe}.card{background:var(--panel);border:1px solid var(--bright);border-radius:24px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.4);backdrop-filter:blur(20px)}.q-number{font-size:12px;color:#a78bfa;font-weight:800;margin-bottom:12px}.question{font-size:21px;line-height:1.55;margin-bottom:22px}.options{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:15px;border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:14px;color:#f3f0f8;cursor:pointer;font-size:14px;line-height:1.45}.option:hover{border-color:rgba(168,85,247,.75);background:rgba(168,85,247,.1)}.option.selected{background:rgba(124,58,237,.22);border-color:var(--b)}.letter{min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:800}.answer-box{width:100%;min-height:150px;padding:15px;border:1px solid var(--border);border-radius:14px;background:rgba(0,0,0,.25);color:white;resize:vertical;outline:none;font:14px Arial;line-height:1.55}.answer-box:focus{border-color:var(--b)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:23px}.primary{border:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));color:white;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer}.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}.result{display:none}.result.show{display:block}.result-card{text-align:center}.score{font-size:62px;font-weight:900;background:linear-gradient(90deg,#60a5fa,var(--b),var(--c));-webkit-background-clip:text;color:transparent;margin:10px}.result-sub{color:var(--muted);margin-bottom:25px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{padding:17px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.035)}.stat strong{display:block;font-size:23px;margin-bottom:5px}.stat span{color:var(--muted);font-size:11px}.review{margin-top:22px;text-align:left;display:grid;gap:12px}.review-item{padding:17px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.025)}.review-item.correct{border-color:rgba(52,211,153,.35)}.review-item.wrong{border-color:rgba(251,113,133,.35)}.review-q{font-weight:800;line-height:1.5;margin-bottom:9px}.review-line{font-size:13px;line-height:1.55;color:#cbd5e1;margin-top:5px}.good{color:var(--good)}.bad{color:var(--bad)}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty h2{color:white;margin-bottom:8px}@media(max-width:650px){body{padding:18px 12px}.top{align-items:flex-start}.logo{font-size:20px}.card{padding:19px}.question{font-size:18px}.stat-grid{grid-template-columns:1fr}.nav{flex-direction:column-reverse}.nav .primary,.nav .btn{width:100%}}
</style></head>
<body>
<div class="container">
<div class="top"><div class="logo">💬 DIVYAM<span>.AI</span> 🤖</div><div class="top-actions"><button class="btn" onclick="location.href='custom-test.html'">⚙️ New Test</button><button class="btn" onclick="location.href='dashboard.html'">← Dashboard</button></div></div>
<div id="testArea"></div>
<div id="resultArea" class="result"></div>
</div>
<script>
let test=null,current=0,answers=[],submitted=false,remainingSeconds=null,timerId=null;
const testArea=document.getElementById('testArea'),resultArea=document.getElementById('resultArea');
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadTest(){try{test=JSON.parse(sessionStorage.getItem('divyamai_custom_test')||'null')}catch(e){test=null}if(!test||!Array.isArray(test.questions)||!test.questions.length){testArea.innerHTML='<div class="card empty"><h2>📝 No test found</h2><p>Generate a Custom Test first, then come back here.</p><br><button class="primary" onclick="location.href=\'custom-test.html\'">✨ Create Test</button></div>';return}answers=new Array(test.questions.length).fill('');if(Number.isFinite(Number(test.timeLimit))&&Number(test.timeLimit)>0){remainingSeconds=Number(test.timeLimit)*60;startTimer()}render()}
function startTimer(){timerId=setInterval(()=>{remainingSeconds--;if(remainingSeconds<=0){remainingSeconds=0;clearInterval(timerId);submitTest(true)}if(!submitted)renderTimer()},1000)}
function renderTimer(){const el=document.getElementById('timer');if(!el)return;const m=String(Math.floor(remainingSeconds/60)).padStart(2,'0'),s=String(remainingSeconds%60).padStart(2,'0');el.textContent=`⏱️ ${m}:${s}`}
function render(){if(submitted)return;const q=test.questions[current],count=test.questions.length,pct=((current+1)/count)*100;const type=(q.type||'MCQ').toLowerCase();let content='';if(type==='mcq'||Array.isArray(q.options)&&q.options.length){content='<div class="options">'+q.options.map((opt,i)=>`<button class="option ${answers[current]===opt?'selected':''}" onclick="choose(${JSON.stringify(opt).replace(/</g,'\\u003c')})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span></button>`).join('')+'</div>'}else{content=`<textarea class="answer-box" placeholder="Type your answer here..." oninput="answers[current]=this.value">${escapeHtml(answers[current])}</textarea>`}
testArea.innerHTML=`<div class="hero"><div class="eyebrow">🧠 CUSTOM TEST</div><h1>${escapeHtml(test.title||'Your Custom Test')}</h1><p>${escapeHtml(test.subject||'')} • ${escapeHtml(test.topic||'')}</p><div class="meta"><span class="pill">🎓 ${escapeHtml(test.classLevel||'')}</span><span class="pill">🎯 ${escapeHtml(test.difficulty||'Mixed')}</span><span class="pill">❓ ${escapeHtml(test.questionType||'Mixed')}</span><span class="pill">🔢 ${count} questions</span><span class="pill timer" id="timer">${remainingSeconds!==null?'⏱️ --:--':'⏱️ No limit'}</span></div></div><div class="progress-wrap"><div class="progress-row"><span>Question ${current+1} of ${count}</span><span>${Math.round(pct)}% complete</span></div><div class="progress"><div style="width:${pct}%"></div></div></div><div class="card"><div class="q-number">QUESTION ${current+1} • ${escapeHtml(q.type||'QUESTION')}</div><div class="question">${escapeHtml(q.question)}</div>${content}<div class="nav"><button class="btn" ${current===0?'disabled':''} onclick="previousQuestion()">← Previous</button>${current===count-1?'<button class="primary" onclick="submitTest(false)">🏆 Submit Test</button>':'<button class="primary" onclick="nextQuestion()">Next →</button>'}</div></div>`;renderTimer()}
function choose(value){answers[current]=value;render()}
function nextQuestion(){if(current<test.questions.length-1){current++;render()}}
function previousQuestion(){if(current>0){current--;render()}}
function submitTest(auto){if(submitted)return;if(!auto&&!confirm('Submit this test now? You will see your score and answer review.'))return;submitted=true;if(timerId)clearInterval(timerId);calculateResults()}
function normalise(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function calculateResults(){let correct=0,answered=0;const reviews=test.questions.map((q,i)=>{const given=answers[i]||'';if(given.trim())answered++;const right=q.answer||'';let isCorrect=false;if((q.type||'').toLowerCase()==='mcq'||Array.isArray(q.options)&&q.options.length)isCorrect=normalise(given)===normalise(right);else isCorrect=normalise(given)===normalise(right);if(isCorrect)correct++;return{q,given,right,isCorrect}});const total=test.questions.length,score=Math.round(correct/total*100);let message=score>=90?'Outstanding! 🔥':score>=75?'Great work! 🌟':score>=50?'Good effort! 💪':'Keep practising! 🚀';resultArea.innerHTML=`<div class="hero"><div class="eyebrow">🏆 TEST COMPLETE</div><h1>Here's your <span style="background:linear-gradient(90deg,#60a5fa,#a855f7,#ec4899);-webkit-background-clip:text;color:transparent">Result</span></h1><p>${escapeHtml(test.title||'Custom Test')} • ${message}</p></div><div class="card result-card"><div class="score">${score}%</div><div class="result-sub">${correct} out of ${total} questions correct</div><div class="stat-grid"><div class="stat"><strong>${correct}</strong><span>✅ Correct</span></div><div class="stat"><strong>${total-correct}</strong><span>❌ Incorrect</span></div><div class="stat"><strong>${answered}</strong><span>✍️ Answered</span></div></div><div class="nav"><button class="btn" onclick="location.href='custom-test.html'">🔄 New Test</button><button class="primary" onclick="location.href='dashboard.html'">🏠 Dashboard</button></div><div class="review"><h2 style="margin:10px 0">📖 Answer Review</h2>${reviews.map((r,i)=>`<div class="review-item ${r.isCorrect?'correct':'wrong'}"><div class="review-q">${i+1}. ${escapeHtml(r.q.question)}</div><div class="review-line ${r.isCorrect?'good':'bad'}">${r.isCorrect?'✅ Correct':'❌ Incorrect'}</div><div class="review-line"><b>Your answer:</b> ${escapeHtml(r.given||'Not answered')}</div><div class="review-line"><b>Correct answer:</b> ${escapeHtml(r.right)}</div>${r.q.explanation?`<div class="review-line"><b>💡 Explanation:</b> ${escapeHtml(r.q.explanation)}</div>`:''}</div>`).join('')}</div></div>`;testArea.style.display='none';resultArea.classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}
loadTest();
</script></body></html>
