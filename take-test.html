<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DIVYAM.AI — Take Test</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#080516;--panel:rgba(14,7,35,.92);--border:rgba(168,85,247,.32);--a:#7c3aed;--b:#a855f7;--c:#ec4899;--text:#f8faff;--muted:#a8b7d0;--good:#34d399;--bad:#fb7185}body{min-height:100vh;font-family:Arial;color:var(--text);background:radial-gradient(circle at 10% 0%,rgba(124,58,237,.35),transparent 34%),radial-gradient(circle at 90% 100%,rgba(236,72,153,.22),transparent 38%),var(--bg);padding:24px 18px}.container{width:min(980px,100%);margin:auto}.top,.nav,.progress-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{margin-bottom:24px}.logo{font-size:24px;font-weight:800}.logo span,.score{background:linear-gradient(90deg,#60a5fa,var(--b),var(--c));-webkit-background-clip:text;color:transparent}.top-actions{display:flex;gap:8px}.btn,.primary{border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800;color:white}.btn{border:1px solid var(--border);background:rgba(255,255,255,.05)}.primary{border:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c))}.btn:disabled{opacity:.4;cursor:not-allowed}.hero{margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9c86c9;font-weight:800;margin-bottom:8px}.hero h1{font-size:clamp(28px,5vw,44px);margin-bottom:7px}.hero p{color:var(--muted);line-height:1.6}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.pill{padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);font-size:12px;color:#d8d1e6}.timer{font-weight:900}.timer.warn{color:#fda4af;border-color:rgba(251,113,133,.55)}.progress-wrap{margin:18px 0}.progress{height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--a),var(--b),var(--c))}.card{background:var(--panel);border:1px solid rgba(217,70,239,.6);border-radius:24px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.4);backdrop-filter:blur(20px)}.q-number{font-size:12px;color:#a78bfa;font-weight:800;margin-bottom:10px}.marks{float:right;color:#d8b4fe}.question{font-size:21px;line-height:1.55;margin-bottom:22px}.options{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:15px;border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:14px;color:#f3f0f8;cursor:pointer;font-size:14px;position:relative;z-index:5;pointer-events:auto}.option.selected{background:rgba(124,58,237,.32);border-color:var(--b);box-shadow:0 0 0 2px rgba(168,85,247,.2)}.letter{min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:800}.answer-box{width:100%;min-height:170px;padding:15px;border:1px solid var(--border);border-radius:14px;background:rgba(0,0,0,.25);color:white;resize:vertical;outline:none;font:14px Arial;line-height:1.55}.answer-box:focus{border-color:var(--b)}.nav{margin-top:23px}.question-jump{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.jump{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:white;cursor:pointer}.jump.current{background:linear-gradient(90deg,var(--a),var(--b));border:0}.jump.answered{box-shadow:inset 0 -3px var(--good)}.result{display:none}.result.show{display:block}.result-card{text-align:center}.score{font-size:62px;font-weight:900;margin:10px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{padding:15px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.035)}.stat strong{display:block;font-size:22px}.stat span{color:var(--muted);font-size:11px}.review{margin-top:22px;text-align:left;display:grid;gap:12px}.review-item{padding:17px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.025)}.review-item.correct{border-color:rgba(52,211,153,.35)}.review-item.wrong{border-color:rgba(251,113,133,.35)}.review-q{font-weight:800;line-height:1.5}.review-line{font-size:13px;line-height:1.55;color:#cbd5e1;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:650px){body{padding:18px 12px}.top{align-items:flex-start}.logo{font-size:20px}.card{padding:19px}.question{font-size:18px}.stat-grid{grid-template-columns:1fr 1fr}.nav{flex-wrap:wrap}.nav>*{flex:1}.top-actions{flex-wrap:wrap}}</style></head><body><div class="container"><div class="top"><div class="logo">💬 DIVYAM<span>.AI</span> 🤖</div><div class="top-actions"><button class="btn" onclick="location.href='custom-test.html'">⚙️ New Test</button><button class="btn" onclick="location.href='dashboard.html'">← Dashboard</button></div></div><div id="testArea"></div><div id="resultArea" class="result"></div></div><script>
let test=null,current=0,answers=[],submitted=false,remainingSeconds=null,questionRemaining=null,timerId=null;const testArea=document.getElementById('testArea'),resultArea=document.getElementById('resultArea');const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const N=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,' ');function save(){try{sessionStorage.setItem('divyamai_custom_answers',JSON.stringify(answers))}catch(e){}}function restore(){try{const a=JSON.parse(sessionStorage.getItem('divyamai_custom_answers')||'null');if(Array.isArray(a)&&a.length===test.questions.length)answers=a}catch(e){}}
function load(){try{test=JSON.parse(sessionStorage.getItem('divyamai_custom_test')||'null')}catch(e){test=null}if(!test?.questions?.length){testArea.innerHTML='<div class="card" style="text-align:center;padding:50px"><h2>📝 No test found</h2><p style="color:var(--muted);margin:10px">Generate a Custom Test first.</p><button class="primary" onclick="location.href=\'custom-test.html\'">✨ Create Test</button></div>';return}answers=new Array(test.questions.length).fill('');restore();if(Number(test.timeLimit)>0)remainingSeconds=Number(test.timeLimit)*60;startQuestion()}
function startQuestion(){const q=test.questions[current],configured=Number(q.timeSeconds)||0;questionRemaining=configured>0?configured:null;render();}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(submitted)return;if(remainingSeconds!==null){remainingSeconds--;if(remainingSeconds<=0){remainingSeconds=0;submitTest(true);return}}if(questionRemaining!==null){questionRemaining--;if(questionRemaining<=0){questionRemaining=0;if(current<test.questions.length-1){current++;startQuestion();return}else{submitTest(true);return}}}renderTimer()},1000)}
function renderTimer(){const qEl=document.getElementById('questionTimer'),oEl=document.getElementById('overallTimer');if(qEl){qEl.textContent=questionRemaining===null?'⏱️ No per-question limit':`⏱️ Question: ${fmt(questionRemaining)}`;qEl.classList.toggle('warn',questionRemaining!==null&&questionRemaining<=10)}if(oEl)oEl.textContent=remainingSeconds===null?'⏱️ No overall limit':`⏱️ Overall: ${fmt(remainingSeconds)}`}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){if(submitted)return;const q=test.questions[current],count=test.questions.length,p=((current+1)/count)*100,type=String(q.type||'MCQ').toLowerCase();let content;if(type==='mcq'||q.options?.length)content='<div class="options">'+q.options.map((o,i)=>`<button type="button" class="option ${N(answers[current])===N(o)?'selected':''}" data-option-index="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${E(o)}</span></button>`).join('')+'</div>';else content=`<textarea id="answerBox" class="answer-box" placeholder="Type your answer here...">${E(answers[current])}</textarea>`;testArea.innerHTML=`<div class="hero"><div class="eyebrow">🧠 CUSTOM TEST</div><h1>${E(test.title||'Your Custom Test')}</h1><p>${E(test.subject||'')} • ${E(test.topic||'')}</p><div class="meta"><span class="pill">🎓 ${E(test.classLevel||'')}</span><span class="pill">🎯 ${E(test.difficulty||'')}</span><span class="pill">❓ ${E(test.questionType||'')}</span><span class="pill">🔢 ${count} questions</span><span class="pill timer" id="overallTimer"></span><span class="pill timer" id="questionTimer"></span></div></div><div class="progress-wrap"><div class="progress-row"><span>Question ${current+1} of ${count}</span><span>${Math.round(p)}%</span></div><div class="progress"><div style="width:${p}%"></div></div></div><div class="card"><div class="q-number">QUESTION ${current+1} <span class="marks">🎯 ${q.maxMarks||1} mark${(q.maxMarks||1)==1?'':'s'}</span></div><div class="question">${E(q.question)}</div>${content}<div class="nav"><button type="button" class="btn" id="prevBtn" ${current===0?'disabled':''}>← Previous</button><button type="button" class="btn" id="skipBtn">⏭️ Skip</button>${current===count-1?'<button type="button" class="primary" id="submitBtn">🏆 Submit Test</button>':'<button type="button" class="primary" id="nextBtn">Next →</button>'}</div><div class="question-jump">${test.questions.map((_,i)=>`<button class="jump ${i===current?'current':''} ${String(answers[i]||'').trim()?'answered':''}" data-jump="${i}">${i+1}</button>`).join('')}</div></div>`;renderTimer();startTimer()}
testArea.addEventListener('click',e=>{const o=e.target.closest('.option');if(o&&!submitted){const i=Number(o.dataset.optionIndex);answers[current]=String(test.questions[current].options[i]??'');save();render();return}const jump=e.target.closest('[data-jump]');if(jump){current=Number(jump.dataset.jump);startQuestion();return}if(e.target.closest('#nextBtn')){if(current<test.questions.length-1){current++;startQuestion()}return}if(e.target.closest('#prevBtn')){if(current>0){current--;startQuestion()}return}if(e.target.closest('#skipBtn')){if(current<test.questions.length-1){current++;startQuestion()}else submitTest(false);return}if(e.target.closest('#submitBtn'))submitTest(false)});testArea.addEventListener('input',e=>{if(e.target.id==='answerBox'){answers[current]=e.target.value;save()}});
function submitTest(auto){if(submitted)return;if(!auto&&!confirm('Submit this test now?'))return;submitted=true;clearInterval(timerId);save();evaluateAndShow(auto)}
async function evaluateAndShow(auto){const written=test.questions.map((q,i)=>({index:i,type:q.type,question:q.question,studentAnswer:answers[i]||'',modelAnswer:q.answer,maxMarks:Number(q.maxMarks)||1})).filter(x=>x.type!=='MCQ');let ai=null;if(written.some(x=>x.studentAnswer.trim())){try{const url='https://teosakxikuswuhtbkmuv.supabase.co/functions/v1/evaluate-test';const key='sb_publishable_Wh3yh8OShJ2HnvwUhbInlg_0rGRIxOe';const client=window.supabase||null;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({answers:written})});if(r.ok)ai=await r.json()}catch(e){console.warn('AI evaluation unavailable',e)}}calculate(ai?.evaluations||[],auto)}
function calculate(evals,auto){const map=new Map(evals.map(e=>[Number(e.index),e]));let earned=0,total=0,answered=0;const reviews=test.questions.map((q,i)=>{const max=Number(q.maxMarks)||1;total+=max;const given=String(answers[i]||'');if(given.trim())answered++;if(String(q.type).toLowerCase()==='mcq'){const ok=N(given)===N(q.answer);if(ok)earned+=max;return{q,given,right:q.answer,score:ok?max:0,max,feedback:q.explanation||'',missing:[],ok}}const ev=map.get(i);const score=ev?Math.min(max,Math.max(0,Number(ev.score)||0)):0;earned+=score;return{q,given,right:q.answer,score,max,feedback:ev?.feedback||'AI evaluation was unavailable; answer shown for review.',missing:ev?.missingPoints||[],ok:score>=max};});const pct=total?Math.round(earned/total*100):0;resultArea.innerHTML=`<div class="hero"><div class="eyebrow">🏆 TEST COMPLETE</div><h1>Your Result</h1><p>${E(test.title||'Custom Test')} ${auto?'• ⏰ Time ended':''}</p></div><div class="card result-card"><div class="score">${earned}/${total}</div><div style="font-size:18px">${pct}%</div><div class="stat-grid"><div class="stat"><strong>${earned}</strong><span>🎯 Marks earned</span></div><div class="stat"><strong>${total}</strong><span>📚 Total marks</span></div><div class="stat"><strong>${answered}</strong><span>✍️ Answered</span></div><div class="stat"><strong>${total-earned}</strong><span>📌 Marks lost</span></div></div><div class="nav"><button class="btn" onclick="location.href='custom-test.html'">🔄 New Test</button><button class="primary" onclick="location.href='dashboard.html'">🏠 Dashboard</button></div><div class="review"><h2>📖 Detailed Evaluation</h2>${reviews.map((r,i)=>`<div class="review-item ${r.score===r.max?'correct':'wrong'}"><div class="review-q">${i+1}. ${E(r.q.question)}</div><div class="review-line"><b>🎯 Marks:</b> ${r.score}/${r.max}</div><div class="review-line"><b>✍️ Your answer:</b> ${E(r.given||'Not answered')}</div><div class="review-line"><b>✅ Model answer:</b> ${E(r.right)}</div>${r.feedback?`<div class="review-line"><b>💡 Feedback:</b> ${E(r.feedback)}</div>`:''}${r.missing?.length?`<div class="review-line bad"><b>📌 Improve:</b> ${E(r.missing.join(' • '))}</div>`:''}</div>`).join('')}</div></div>`;testArea.style.display='none';resultArea.classList.add('show');try{sessionStorage.removeItem('divyamai_custom_answers')}catch(e){}window.scrollTo({top:0,behavior:'smooth'})}load();</script></body></html>
