<meta charset="UTF-8">

<title>DIVYAM.AI — Login</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #05050a;

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow-x: hidden;

        padding: 30px 0;
    }


    /* =========================
       BACKGROUND GLOW
    ========================= */

    .glow-one {
        position: fixed;

        width: 500px;
        height: 500px;

        background: #8b5cf6;

        filter: blur(180px);

        opacity: 0.18;

        top: -200px;
        left: -150px;

        pointer-events: none;
    }


    .glow-two {
        position: fixed;

        width: 500px;
        height: 500px;

        background: #06b6d4;

        filter: blur(180px);

        opacity: 0.14;

        bottom: -250px;
        right: -150px;

        pointer-events: none;
    }


    .glow-three {
        position: fixed;

        width: 400px;
        height: 400px;

        background: #ec4899;

        filter: blur(180px);

        opacity: 0.10;

        top: 40%;
        left: 45%;

        pointer-events: none;
    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
        width: 430px;

        max-width: 92%;

        position: relative;

        z-index: 2;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {

        text-align: center;

        font-size: 30px;

        font-weight: 800;

        letter-spacing: 1px;

        margin-bottom: 30px;
    }


    .logo span {

        background:
            linear-gradient(
                90deg,
                #a855f7,
                #6366f1,
                #06b6d4,
                #ec4899
            );

        -webkit-background-clip: text;

        background-clip: text;

        color: transparent;
    }


    /* =========================
       AUTH CARD
    ========================= */

    .auth-card {

        padding: 38px;

        border-radius: 26px;

        background:
            rgba(15,15,25,0.78);

        backdrop-filter: blur(25px);

        -webkit-backdrop-filter: blur(25px);

        border:
            1px solid rgba(255,255,255,0.10);

        box-shadow:
            0 30px 100px rgba(0,0,0,0.55);
    }


    /* =========================
       HEADING
    ========================= */

    .auth-card h1 {

        text-align: center;

        font-size: 30px;

        margin-bottom: 10px;
    }


    .subtitle {

        text-align: center;

        color: #9292a2;

        font-size: 14px;

        margin-bottom: 30px;

        line-height: 1.5;
    }


    /* =========================
       TABS
    ========================= */

    .tabs {

        display: flex;

        background:
            rgba(255,255,255,0.05);

        padding: 5px;

        border-radius: 12px;

        margin-bottom: 28px;
    }


    .tab {

        flex: 1;

        padding: 11px;

        border: none;

        border-radius: 9px;

        background: transparent;

        color: #888897;

        cursor: pointer;

        font-weight: bold;

        transition: 0.25s;
    }


    .tab.active {

        background:
            rgba(139,92,246,0.25);

        color: white;
    }


    /* =========================
       FORM
    ========================= */

    .form-group {

        margin-bottom: 18px;
    }


    label {

        display: block;

        font-size: 13px;

        color: #b8b8c5;

        margin-bottom: 8px;
    }


    input {

        width: 100%;

        padding: 14px 15px;

        border-radius: 12px;

        border:
            1px solid rgba(255,255,255,0.10);

        background:
            rgba(255,255,255,0.045);

        color: white;

        outline: none;

        font-size: 14px;

        transition: 0.25s;
    }


    input:focus {

        border-color: #8b5cf6;

        box-shadow:
            0 0 20px rgba(139,92,246,0.15);
    }


    input::placeholder {

        color: #5f5f6d;
    }


    /* =========================
       PASSWORD
    ========================= */

    .password-box {

        position: relative;
    }


    .password-box input {

        padding-right: 50px;
    }


    .show-password {

        position: absolute;

        right: 15px;

        top: 50%;

        transform:
            translateY(-50%);

        cursor: pointer;

        color: #777786;

        user-select: none;
    }


    /* =========================
       FORGOT PASSWORD
    ========================= */

    .forgot {

        display: block;

        text-align: right;

        color: #a78bfa;

        font-size: 13px;

        text-decoration: none;

        margin-top: -8px;

        margin-bottom: 20px;

        cursor: pointer;

        transition: 0.2s;
    }


    .forgot:hover {

        color: #c4b5fd;
    }


    /* =========================
       BUTTON
    ========================= */

    .submit-button {

        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 12px;

        color: white;

        font-weight: bold;

        font-size: 15px;

        cursor: pointer;

        background:
            linear-gradient(
                90deg,
                #7c3aed,
                #4f46e5,
                #0891b2
            );

        box-shadow:
            0 0 25px rgba(124,58,237,0.30);

        transition: 0.3s;
    }


    .submit-button:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 0 40px rgba(99,102,241,0.50);
    }


    .submit-button:disabled {

        opacity: 0.65;

        cursor: not-allowed;

        transform: none;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

        display: none;

        padding: 12px;

        margin-bottom: 18px;

        border-radius: 10px;

        font-size: 13px;

        line-height: 1.5;

        text-align: center;
    }


    .message.success {

        display: block;

        background:
            rgba(34,197,94,0.10);

        border:
            1px solid rgba(34,197,94,0.25);

        color: #86efac;
    }


    .message.error {

        display: block;

        background:
            rgba(239,68,68,0.10);

        border:
            1px solid rgba(239,68,68,0.25);

        color: #fca5a5;
    }


    /* =========================
       TERMS
    ========================= */

    .terms {

        margin-top: 20px;

        font-size: 11px;

        color: #666675;

        text-align: center;

        line-height: 1.5;
    }


    /* =========================
       HIDDEN
    ========================= */

    .hidden {

        display: none !important;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

        .auth-card {

            padding:
                28px 22px;
        }


        .auth-card h1 {

            font-size: 26px;
        }


        .logo {

            font-size: 27px;
        }
    }

</style>

</head>

<body>

```
<div class="glow-one"></div>

<div class="glow-two"></div>

<div class="glow-three"></div>


<div class="container">


    <!-- LOGO -->

    <div class="logo">

        DIVYAM<span>.AI</span>

    </div>


    <!-- AUTH CARD -->

    <div class="auth-card">


        <h1 id="title">
            Welcome back
        </h1>


        <p
            class="subtitle"
            id="subtitle">

            Sign in to continue your
            learning journey.

        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- TABS -->

        <div class="tabs">


            <button
                type="button"
                class="tab active"
                id="loginTab"
                onclick="showLogin()">

                Log In

            </button>


            <button
                type="button"
                class="tab"
                id="signupTab"
                onclick="showSignup()">

                Sign Up

            </button>


        </div>


        <!-- =====================
             LOGIN FORM
        ====================== -->

        <form id="loginForm">


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>


                <div class="password-box">


                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <span
                        class="show-password"
                        onclick="togglePassword('loginPassword')">

                        👁

                    </span>


                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <a
                href="#"
                class="forgot"
                onclick="forgotPassword(event)">

                Forgot password?

            </a>


            <button
                type="submit"
                class="submit-button">

                ✨ Log In

            </button>


        </form>


        <!-- =====================
             SIGNUP FORM
        ====================== -->

        <form
            id="signupForm"
            class="hidden">


            <div class="form-group">

                <label>
                    Your Name
                </label>

                <input
                    id="signupName"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>


                <div class="password-box">


                    <input
                        id="signupPassword"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required>


                    <span
                        class="show-password"
                        onclick="togglePassword('signupPassword')">

                        👁

                    </span>


                </div>

            </div>


            <button
                type="submit"
                class="submit-button">

                🚀 Create Account

            </button>


            <p class="terms">

                By creating an account, you agree
                to use DIVYAM.AI responsibly for
                educational purposes.

            </p>


        </form>


    </div>

</div>


<script>

    /* =========================
       SUPABASE CONFIGURATION
    ========================= */

    const SUPABASE_URL =
        "https://teosakxikuswuhtbkmuv.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_Wh3yh8OShJ2HnvwUhbInlg_0rGRIxOe";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       MESSAGE SYSTEM
    ========================= */

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );

        message.innerText = text;

        message.className =
            "message " + type;

    }


    function clearMessage() {

        const message =
            document.getElementById(
                "message"
            );

        message.innerText = "";

        message.className =
            "message";

    }


    /* =========================
       LOGIN / SIGNUP SWITCH
    ========================= */

    function showLogin() {

        clearMessage();


        document.getElementById(
            "loginForm"
        ).classList.remove("hidden");


        document.getElementById(
            "signupForm"
        ).classList.add("hidden");


        document.getElementById(
            "loginTab"
        ).classList.add("active");


        document.getElementById(
            "signupTab"
        ).classList.remove("active");


        document.getElementById(
            "title"
        ).innerText =
            "Welcome back";


        document.getElementById(
            "subtitle"
        ).innerText =
            "Sign in to continue your learning journey.";

    }


    function showSignup() {

        clearMessage();


        document.getElementById(
            "loginForm"
        ).classList.add("hidden");


        document.getElementById(
            "signupForm"
        ).classList.remove("hidden");


        document.getElementById(
            "loginTab"
        ).classList.remove("active");


        document.getElementById(
            "signupTab"
        ).classList.add("active");


        document.getElementById(
            "title"
        ).innerText =
            "Create your account";


        document.getElementById(
            "subtitle"
        ).innerText =
            "Join DIVYAM.AI and start learning smarter.";

    }


    /* =========================
       PASSWORD VISIBILITY
    ========================= */

    function togglePassword(id) {

        const input =
            document.getElementById(id);


        if (input.type === "password") {

            input.type = "text";

        } else {

            input.type = "password";

        }

    }


    /* =========================
       SIGN UP
    ========================= */

    document.getElementById(
        "signupForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            clearMessage();


            const name =
                document.getElementById(
                    "signupName"
                ).value.trim();


            const email =
                document.getElementById(
                    "signupEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "signupPassword"
                ).value;


            const button =
                this.querySelector(
                    ".submit-button"
                );


            button.innerText =
                "Creating account...";


            button.disabled = true;


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {
                                full_name: name
                            },

                            emailRedirectTo:
                                window.location.origin +
                                window.location.pathname

                        }

                    });


                if (error) {

                    showMessage(
                        "❌ " +
                        error.message,
                        "error"
                    );

                    button.innerText =
                        "🚀 Create Account";

                    button.disabled =
                        false;

                    return;

                }


                /*
                   If email confirmation is enabled,
                   Supabase creates the account but
                   requires verification.
                */

                if (
                    data.user &&
                    !data.session
                ) {

                    showMessage(
                        "✅ Account created! Please check your email and verify your account before logging in.",
                        "success"
                    );

                } else {

                    showMessage(
                        "🎉 Account created successfully!",
                        "success"
                    );

                }


                this.reset();


                button.innerText =
                    "🚀 Create Account";

                button.disabled =
                    false;


            } catch (error) {

                showMessage(
                    "❌ Something went wrong: " +
                    error.message,
                    "error"
                );


                button.innerText =
                    "🚀 Create Account";

                button.disabled =
                    false;

            }

        }
    );


    /* =========================
       LOGIN
    ========================= */

    document.getElementById(
        "loginForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            clearMessage();


            const email =
                document.getElementById(
                    "loginEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            const button =
                this.querySelector(
                    ".submit-button"
                );


            button.innerText =
                "Logging in...";


            button.disabled = true;


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {

                    showMessage(
                        "❌ " +
                        error.message,
                        "error"
                    );


                    button.innerText =
                        "✨ Log In";

                    button.disabled =
                        false;

                    return;

                }


                /* EMAIL VERIFICATION */

                if (
                    !data.user.email_confirmed_at
                ) {

                    await supabaseClient.auth
                        .signOut();


                    showMessage(
                        "📧 Please verify your email before logging in.",
                        "error"
                    );


                    button.innerText =
                        "✨ Log In";

                    button.disabled =
                        false;

                    return;

                }


                /* SUCCESS */

                showMessage(
                    "🎉 Login successful! Opening your dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );


            } catch (error) {

                showMessage(
                    "❌ Something went wrong: " +
                    error.message,
                    "error"
                );


                button.innerText =
                    "✨ Log In";

                button.disabled =
                    false;

            }

        }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    async function forgotPassword(event) {

        event.preventDefault();


        clearMessage();


        const email =
            document.getElementById(
                "loginEmail"
            ).value.trim();


        /*
           If email field is empty,
           ask the user for it.
        */

        if (!email) {

            const enteredEmail =
                prompt(
                    "Enter the email address used for your DIVYAM.AI account:"
                );


            if (!enteredEmail) {

                return;

            }


            document.getElementById(
                "loginEmail"
            ).value =
                enteredEmail.trim();

        }


        const finalEmail =
            document.getElementById(
                "loginEmail"
            ).value.trim();


        if (!finalEmail) {

            return;

        }


        try {


            showMessage(
                "📧 Sending password reset email...",
                "success"
            );


            const {
                error
            } =
                await supabaseClient.auth
                .resetPasswordForEmail(
                    finalEmail,
                    {

                        redirectTo:
                            window.location.origin +
                            window.location.pathname

                    }
                );


            if (error) {

                showMessage(
                    "❌ " +
                    error.message,
                    "error"
                );

                return;

            }


            showMessage(
                "📧 Password reset email sent! Check your inbox, Spam and Promotions folders.",
                "success"
            );


        } catch (error) {

            showMessage(
                "❌ Something went wrong: " +
                error.message,
                "error"
            );

        }

    }


    /* =========================
       PASSWORD RESET SESSION
    ========================= */

    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            if (
                event === "PASSWORD_RECOVERY"
            ) {

                const newPassword =
                    prompt(
                        "Enter your new DIVYAM.AI password:"
                    );


                if (!newPassword) {

                    return;

                }


                if (
                    newPassword.length < 6
                ) {

                    alert(
                        "Password must be at least 6 characters long."
                    );

                    return;

                }


                const {
                    error
                } =
                    await supabaseClient.auth
                    .updateUser({

                        password:
                            newPassword

                    });


                if (error) {

                    alert(
                        "❌ Password reset failed:\n\n" +
                        error.message
                    );

                } else {

                    alert(
                        "🎉 Password changed successfully!\n\nYou can now log in with your new password."
                    );

                    await supabaseClient.auth
                        .signOut();

                }

            }

        }
    );

</script>
